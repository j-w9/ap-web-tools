name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (type-aware, no any, no unsafe casts)
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Tests
        run: npm test
      - name: Build
        run: npx vite build
