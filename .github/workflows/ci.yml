name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Fetch the upstream modules used by oracle tests
        # Only these nested submodules are needed; a recursive checkout would pull all of ArduPilot.
        run: git -C upstream submodule update --init --depth 1 modules/JsDataflashParser modules/tabulator modules/luxon
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (type-aware, no any, no unsafe casts)
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Tests
        run: npm test
      - name: Slow proofs (one file at a time)
        run: npx vitest run --no-file-parallelism proofs/mavlink/sha256-length.test.ts proofs/scurve-tool/scurve-tool.test.ts packages/mavlink/src/sha256.test.ts
        env:
          APWT_SLOW_PROOFS: '1'
      - name: Build
        run: npx vite build
      - name: Upload the site for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Publishes the site checked above; only a green push to main deploys.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
